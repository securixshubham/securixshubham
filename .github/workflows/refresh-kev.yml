
name: Refresh CISA KEV intelligence panel

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update-kev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update CISA KEV panel
        run: python scripts/update_kev.py

      - name: Commit updated panel
        run: |
          if git diff --quiet -- assets/kev-feed.svg; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kev-feed.svg
          git commit -m "Update CISA KEV intelligence"
          git push
